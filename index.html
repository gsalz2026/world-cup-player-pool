<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>World Cup Player Pool</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <section id="loginPage" class="login-page" aria-label="Login">
      <div class="login-panel">
        <p class="eyebrow">World Cup Player Pool</p>
        <h1>Lluvia de Goles</h1>
        <div>
          <label for="loginParticipant">Choose your name</label>
          <select id="loginParticipant"></select>
        </div>
        <button id="loginBtn" class="primary">Enter Pool</button>
      </div>
    </section>

    <header class="topbar">
      <div class="topbar-main">
        <div>
          <p class="eyebrow">World Cup Player Pool</p>
          <h1>Lluvia de Goles</h1>
        </div>
        <div class="clock-panel">
          <span id="currentPickLabel">Pick 1</span>
          <strong id="onClockLabel">Loading...</strong>
          <span id="onDeckLabel">On deck: Loading...</span>
        </div>
        <div id="userSession"></div>
        <label class="view-toggle" aria-label="View mode">
          <span>Desktop</span>
          <input id="viewModeToggle" type="checkbox">
          <span class="view-track"><span class="view-thumb"></span></span>
          <span>Mobile</span>
        </label>
        <button id="updateRostersBtn" class="title-action">Update World Cup Rosters</button>
      </div>
      <nav class="tabs" aria-label="Pool sections">
        <button class="tab active" data-tab="draft">Draft Board</button>
        <button class="tab" data-tab="queue">Draft Queue</button>
        <button class="tab" data-tab="teams">Teams & Scoring</button>
        <button class="tab" data-tab="squads">Squads</button>
        <button class="tab" data-tab="standings">Standings</button>
      </nav>
    </header>

    <main>
      <section class="setup-panel">
        <div class="participant-strip">
          <div class="setup-count">
            <span class="setup-kicker">Draft Setup</span>
            <label for="participantCount">Participants</label>
            <select id="participantCount"></select>
          </div>
          <div id="participantInputs" class="participant-inputs"></div>
        </div>
        <div class="setup-actions">
          <div class="action-group workflow-actions">
            <button id="saveParticipantsBtn" class="primary">Save</button>
            <button id="lockParticipantsBtn">Lock Names</button>
            <button id="randomizeOrderBtn">Randomize</button>
            <button id="lockOrderBtn">Lock Order</button>
          </div>
          <div class="action-group utility-actions">
            <button id="undoPickBtn">Undo</button>
            <button id="resetDraftBtn" class="danger">Reset</button>
          </div>
        </div>
      </section>

      <section id="draft" class="tab-panel active"></section>
      <section id="queue" class="tab-panel"></section>
      <section id="teams" class="tab-panel"></section>
      <section id="squads" class="tab-panel"></section>
      <section id="standings" class="tab-panel"></section>
    </main>

    <template id="emptyStateTemplate">
      <div class="empty-state">
        <strong>No players here yet.</strong>
        <span>Try clearing your filters or switching tabs.</span>
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
